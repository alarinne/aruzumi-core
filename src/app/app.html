<header class = "terminal-header">
  <div class = "terminal-controls" aria-hidden = "true">
    <span class = "terminal-dot terminal-dot-red"></span>
    <span class = "terminal-dot terminal-dot-yellow"></span>
    <span class = "terminal-dot terminal-dot-green"></span>
  </div>
  <span class = "terminal-title">aruzumi.exe - guest session</span>
</header>
<main class = "terminal-content">
  <div class = "intro-banner">
  <h1 class = "name-banner" aria-label="Aruzhan">
    <span aria-hidden = "true">{{ nameBanner }}</span>
  </h1>
  <pre class="crescent" aria-hidden = "true">{{ crescent }}</pre>
  </div>
  <p class = "intro-tagline">
    Developer. Still loading. A little mystery.
  </p>
  <p class = "intro-hint">
    Type <span class = "intro-command">help</span> to explore.
  </p>
  @for (entry of history(); track $index) {
    <div class="terminal-entry">
      <div class="command-line">
        <span class="command-prompt">guest@aruzumi:~$</span>
        <span>{{ entry.command }}</span>
      </div>
      <p class="command-output">{{ entry.output }}</p>
    </div>
  }
  <div class = "command-line">
    <span class = "command-prompt">guest@aruzumi:~$</span>
    <input
      #commandInput
      class = "command-input"
      type = "text"
      aria-label = "Terminal command"
      autocomplete = "off"
      autocapitalize = "off"
      spellcheck = "false"
      (keydown.enter) = "executeCommand(commandInput)"
      />
  </div>
</main>
